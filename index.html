<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Despacho de Materiales</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="header">

<img src="Sin fondo.png" class="logo">

<h1>DESPACHO DE MATERIALES</h1>

<p>
Control de salida y verificación
</p>

</header>



<main class="container">



<section class="card">

<h2>Información del despacho</h2>


<label>
Cliente / Destino
</label>

<input 
id="clienteDestino"
type="text"
placeholder="Ingrese cliente o destino">



<label>
Transporte / Patente
</label>

<input 
id="transportePatente"
type="text"
placeholder="Ingrese transporte y patente">



<label>
Formato de caja
</label>

<input 
id="formatoCaja"
type="text"
placeholder="Ingrese formato de caja">

<label>
Etiqueta cajas
</label>

<input 
id="etiquetaCajas"
type="text"
placeholder="Ingrese etiqueta de cajas">

<label>
Cantidad de cajas
</label>

<input 
id="cantidadCajas"
type="number"
placeholder="Cantidad">



<label>
Número de pallets
</label>

<input 
id="numeroPallets"
type="number"
placeholder="Cantidad">

</section>






<section class="card">


<h2>
Checklist de despacho
</h2>


<div id="checklist"></div>


</section>






<section class="card">


<h2>
Estado final
</h2>



<div class="opciones">


<button
id="estadoCumple"
class="btn-cumple"
onclick="seleccionarEstado('Cumple')">

✅ CUMPLE

</button>




<button
id="estadoNoCumple"
class="btn-no-cumple"
onclick="seleccionarEstado('No cumple')">

❌ NO CUMPLE

</button>



</div>



<label>
Observaciones generales
</label>


<textarea
id="observaciones"
rows="5"
placeholder="Ingrese observaciones">
</textarea>



</section>








<section class="card">


<h2>
Evidencia fotográfica
</h2>



<label>
Foto 1
</label>

<input 
type="file"
id="foto1"
accept="image/*"
capture="environment">





<label>
Foto 2
</label>

<input 
type="file"
id="foto2"
accept="image/*"
capture="environment">





<label>
Foto 3
</label>

<input 
type="file"
id="foto3"
accept="image/*"
capture="environment">



</section>








<section class="card">


<h2>
Responsable
</h2>



<label>
Nombre responsable
</label>


<input
id="responsable"
type="text"
placeholder="Nombre completo">





<label>
Firma
</label>


<canvas id="firma"></canvas>


<button 
type="button"
id="limpiarFirma">

Limpiar firma

</button>



</section>







<button
class="btnGuardar"
id="guardar">

GUARDAR DESPACHO

</button>





<div
id="resultado"
class="resultado">

</div>



</main>



<style>
  .opciones-foto {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 8px 0;
  }

  .opciones-foto button {
    padding: 11px 14px;
    border: 1px solid #55851d;
    border-radius: 10px;
    background: white;
    color: #406718;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }

  .opciones-foto button:first-child {
    background: #55851d;
    color: white;
  }

  /* El campo sigue mostrando el nombre del archivo seleccionado. */
  .archivo-despacho::file-selector-button {
    display: none;
  }
</style>

<script>
  ["foto1", "foto2", "foto3"].forEach(function (id, indice) {
    const campo = document.getElementById(id);
    if (!campo) return;

    campo.removeAttribute("capture");
    campo.classList.add("archivo-despacho");
    campo.required = true;
    campo.setAttribute("aria-label", "Archivo de la foto " + (indice + 1));

    const opciones = document.createElement("div");
    opciones.className = "opciones-foto";

    const camara = document.createElement("button");
    camara.type = "button";
    camara.textContent = "📷 Cámara";

    const galeria = document.createElement("button");
    galeria.type = "button";
    galeria.textContent = "🖼️ Galería";

    camara.addEventListener("click", function () {
      campo.setAttribute("capture", "environment");
      campo.click();
    });

    galeria.addEventListener("click", function () {
      campo.removeAttribute("capture");
      campo.click();
    });

    opciones.append(camara, galeria);
    campo.before(opciones);
  });
</script>
<script src="app.js?v=3"></script>
<script src="buscador.js?v=edicion24-3"></script>

</body>

</html>
