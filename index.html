<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Despacho de Materiales</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="header">

<img src="logo.png" class="logo">

<h1>DESPACHO DE MATERIALES</h1>

<p>
Control de salida y verificación
</p>

</header>




<main class="container">



<section class="card">

<h2>
Información del despacho
</h2>


<label>
Cliente
</label>

<input 
id="cliente"
type="text"
placeholder="Ingrese cliente">



<label>
Destino
</label>

<input 
id="destino"
type="text"
placeholder="Ingrese destino">



<label>
Transporte
</label>

<input 
id="transporte"
type="text"
placeholder="Ingrese transporte">



<label>
Patente
</label>

<input 
id="patente"
type="text"
placeholder="Ingrese patente">



<label>
Formato de caja
</label>

<input 
id="formatoCaja"
type="text"
placeholder="Ej: Caja 10 kg">



<label>
Cantidad de cajas
</label>

<input 
id="cantidadCajas"
type="number">



<label>
Número de pallets
</label>

<input 
id="numeroPallets"
type="number">


</section>





<section class="card">


<h2>
Checklist de despacho
</h2>



<div id="checklist"></div>



</section>






<section class="card">


<h2>
Estado final
</h2>



<label>
Estado despacho
</label>


<select id="estado">


<option value="">
Seleccione
</option>


<option value="Cumple">
Cumple
</option>


<option value="No cumple">
No cumple
</option>


</select>




<label>
Observaciones generales
</label>


<textarea 
id="observaciones"
rows="5"
placeholder="Ingrese observaciones">
</textarea>



</section>







<section class="card">


<h2>
Evidencia fotográfica
</h2>


<label>
Foto 1
</label>

<input 
type="file"
id="foto1"
accept="image/*"
capture="environment">



<label>
Foto 2
</label>

<input 
type="file"
id="foto2"
accept="image/*"
capture="environment">



<label>
Foto 3
</label>

<input 
type="file"
id="foto3"
accept="image/*"
capture="environment">



</section>









<section class="card">


<h2>
Responsable
</h2>



<label>
Nombre responsable
</label>


<input 
id="responsable"
type="text"
placeholder="Nombre completo">





<label>
Firma
</label>


<canvas id="firma"></canvas>


<button 
type="button"
id="limpiarFirma">

Limpiar firma

</button>



</section>








<button 
class="btnGuardar"
id="guardar">

GUARDAR DESPACHO

</button>






<div 
id="resultado"
class="resultado">

</div>




</main>






<script src="app.js"></script>


</body>

</html>
